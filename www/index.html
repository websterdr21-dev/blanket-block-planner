<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blanket Block Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1E2233;
    --ink-navy-soft:#272C42;
    --wool-cream:#EFE7D8;
    --wool-cream-dim:#E2D8C4;
    --berry:#8C3F5D;
    --berry-dark:#6E2F49;
    --marigold:#D69A3E;
    --charcoal:#2A2620;
    --sage:#7C8B7A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink-navy);
    color:var(--wool-cream);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px;}
  header{text-align:center;margin-bottom:8px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.1rem;
    margin:0;
    letter-spacing:0.01em;
    color:var(--wool-cream);
  }
  .tagline{
    font-family:'Caveat',cursive;
    font-size:1.3rem;
    color:var(--marigold);
    margin:4px 0 0;
  }
  .stitch-divider{
    height:16px;
    margin:22px 0 26px;
    background-image:radial-gradient(circle at 8px 0, transparent 6px, var(--marigold) 7px, transparent 8px);
    background-size:16px 16px;
    background-repeat:repeat-x;
    background-position:center;
    opacity:0.85;
  }
  .card{
    background:var(--wool-cream);
    color:var(--charcoal);
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 14px;
    color:var(--berry-dark);
  }
  .field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:6px;}
  label{font-size:0.82rem;font-weight:600;color:var(--sage);text-transform:uppercase;letter-spacing:0.04em;}
  input[type="text"],input[type="number"]{
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid var(--wool-cream-dim);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    color:var(--charcoal);
    min-height:48px;
  }
  input[type="file"]{
    font-size:0.95rem;
    padding:10px 0;
    min-height:48px;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:14px 22px;
    cursor:pointer;
    font-size:1rem;
    min-height:48px;
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  button:active{transform:scale(0.97);}
  button.primary{background:var(--berry);color:#fff;}
  button.primary:hover{background:var(--berry-dark);}
  button.secondary{background:transparent;color:var(--berry-dark);border:1.5px solid var(--berry-dark);}
  button.secondary:hover{background:rgba(140,63,93,0.08);}
  button:disabled{opacity:0.45;cursor:not-allowed;}
  button.link{background:none;color:var(--berry-dark);text-decoration:underline;padding:12px 10px;font-weight:500;min-height:auto;font-size:0.95rem;}
  #addAllBtn, #generateBtn{width:100%;}
  .photo-sources{display:flex;gap:10px;flex-wrap:wrap;}
  .photo-sources button{flex:1;min-width:140px;}

  .pending-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .pending-item{
    display:flex;align-items:center;gap:12px;
    background:#fff;border-radius:12px;padding:12px;
    border:1.5px dashed var(--wool-cream-dim);
    flex-wrap:wrap;
  }
  .pending-item.tracing img{opacity:0.45;}
  .trace-note{flex-basis:100%;font-size:0.82rem;color:var(--sage);font-style:italic;}
  .pending-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .pending-item input[type="text"]{flex:1;min-width:100px;}
  .pending-item input[type="number"]{width:76px;}
  .block-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .block-item{
    display:flex;align-items:center;gap:14px;
    background:#fff;border-radius:12px;padding:10px 12px;
  }
  .block-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--wool-cream-dim);}
  .block-item .info{flex:1;}
  .block-item .name{font-weight:600;font-size:0.98rem;}
  .block-item .qty{font-size:0.85rem;color:var(--sage);}
  .empty-note{font-size:0.9rem;color:var(--sage);font-style:italic;}

  .grid-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .grid-controls .field{max-width:110px;min-width:90px;}
  .totals{font-size:0.85rem;color:var(--sage);margin-top:10px;}
  .totals strong{color:var(--charcoal);}
  .warn{color:var(--berry-dark);font-weight:600;}

  .grid-wrapper{padding:6px 2px 12px;}
  .blanket-grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), 1fr);
    gap:clamp(1px, 0.8vw, 4px);
    width:100%;
  }
  .blanket-grid .cell{
    aspect-ratio:1;
    border-radius:5px;
    overflow:hidden;
    border:1px solid var(--wool-cream-dim);
    background:var(--wool-cream-dim);
  }
  .blanket-grid .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:0.82rem;}
  .legend-item img{width:22px;height:22px;border-radius:4px;object-fit:cover;border:1px solid var(--wool-cream-dim);}
  .result-note{font-size:0.9rem;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blanket Block Planner</h1>
    <p class="tagline">upload your blocks, tell it how many, let it figure out the order</p>
  </header>
  <div class="stitch-divider"></div>

  <div class="card">
    <h2>Add block patterns</h2>
    <div class="field-row">
      <div class="field">
        <label>Add your block photos</label>
        <div class="photo-sources">
          <button type="button" class="secondary" id="takePhotoBtn">Take a photo</button>
          <button type="button" class="secondary" id="pickPhotosBtn">Choose from gallery</button>
        </div>
        <!-- capture="environment" sends Android straight to the camera app;
             the other input opens the picker and takes as many as she likes. -->
        <input type="file" id="blockCamera" accept="image/*" capture="environment" hidden>
        <input type="file" id="blockPhotos" accept="image/*" multiple hidden>
      </div>
    </div>

    <div class="field-row" id="bulkQtyRow" style="display:none;align-items:flex-end;margin-top:10px;">
      <div class="field" style="max-width:110px;min-width:90px;">
        <label for="bulkQtyInput">Set qty for all</label>
        <input type="number" id="bulkQtyInput" min="1" value="1">
      </div>
      <button class="secondary" id="applyQtyBtn">Apply to all</button>
    </div>
    <div class="pending-list" id="pendingList"></div>
    <button class="primary" id="addAllBtn" style="display:none;margin-top:6px;">Add to blanket</button>

    <div class="block-list" id="blockList"></div>
    <p class="empty-note" id="emptyNote">No blocks added yet. Choose photos above to get started.</p>
  </div>

  <div class="card">
    <h2>Blanket size</h2>
    <div class="grid-controls">
      <div class="field">
        <label for="rowsInput">Rows</label>
        <input type="number" id="rowsInput" min="1" value="4">
      </div>
      <div class="field">
        <label for="colsInput">Columns</label>
        <input type="number" id="colsInput" min="1" value="4">
      </div>
      <button class="secondary" id="suggestBtn">Auto-suggest size</button>
    </div>
    <p class="totals" id="totalsNote"></p>
    <button class="primary" id="generateBtn" style="margin-top:14px;">Generate layout</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>Your blanket layout</h2>
    <div class="grid-wrapper">
      <div class="blanket-grid" id="resultGrid"></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="result-note" id="resultNote"></p>
  </div>
</div>

<script>
let blocks = []; // {id, name, qty, photoDataUrl, displayUrl}
let userEditedGrid = false;

const blockPhotosInput = document.getElementById('blockPhotos');
const blockCameraInput = document.getElementById('blockCamera');
const takePhotoBtn = document.getElementById('takePhotoBtn');
const pickPhotosBtn = document.getElementById('pickPhotosBtn');
const pendingListEl = document.getElementById('pendingList');
const addAllBtn = document.getElementById('addAllBtn');
const bulkQtyRow = document.getElementById('bulkQtyRow');
const bulkQtyInput = document.getElementById('bulkQtyInput');
const applyQtyBtn = document.getElementById('applyQtyBtn');
const blockListEl = document.getElementById('blockList');
let pending = []; // {tempId, dataUrl, name, qty}
const emptyNote = document.getElementById('emptyNote');
const rowsInput = document.getElementById('rowsInput');
const colsInput = document.getElementById('colsInput');
const suggestBtn = document.getElementById('suggestBtn');
const totalsNote = document.getElementById('totalsNote');
const generateBtn = document.getElementById('generateBtn');
const resultCard = document.getElementById('resultCard');
const resultGrid = document.getElementById('resultGrid');
const legendEl = document.getElementById('legend');
const resultNote = document.getElementById('resultNote');

rowsInput.addEventListener('input', () => { userEditedGrid = true; updateTotals(); });
colsInput.addEventListener('input', () => { userEditedGrid = true; updateTotals(); });

function readAsDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = e => cb(e.target.result);
  reader.readAsDataURL(file);
}

function guessNameFromFile(file){
  const base = file.name.replace(/\.[^/.]+$/, '');
  return base.replace(/[_-]+/g, ' ').trim();
}

/* --- Vector tracing -------------------------------------------------------
   Photos are traced to flat-colour SVG with vtracer (WebAssembly, on-device).
   If the wasm cannot load - e.g. index.html opened straight off the filesystem,
   where ES module imports are blocked - every block quietly keeps its photo. */
const DEG = Math.PI / 180;
const TRACE_MAX_PX = 160;          // longest side fed to the tracer
const TRACE_BLUR_PX = 1;           // softens yarn texture so it is not traced as detail
const vt = { mod: null, loading: null };

function loadTracer(){
  if(!vt.loading){
    vt.loading = import('./vtracer.js')
      .then(m => m.default({ module_or_path: './vtracer.wasm' }).then(() => { vt.mod = m; }))
      .catch(err => { console.warn('Vector tracing unavailable, using photos as-is.', err); });
  }
  return vt.loading;
}

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* Settings ported from the validated Python vtracer run, then re-tuned against
   a real crochet photo. Two conversions matter: vtracer-wasm takes corner and
   splice thresholds in radians where the CLI takes degrees, and it passes
   colorPrecision straight through as is_same_color_a where the CLI sends
   8 - color_precision, so higher here means more colours merged.

   On real yarn the Python settings traced the stitch texture itself - 300-odd
   paths of mottling. Tracing a smaller, slightly blurred copy throws that
   texture away and keeps the shapes; the result is vector, so it still scales
   up cleanly. colorPrecision above 2 merged the petals into the border. */
function traceConfig(w, h){
  return {
    binary: false,
    mode: 'spline',
    hierarchical: 'stacked',
    colorPrecision: 2,
    layerDifference: 16,
    filterSpeckle: Math.max(8, Math.round(w * h / 2560)),
    cornerThreshold: 140 * DEG,
    lengthThreshold: 15.0,
    spliceThreshold: 80 * DEG,
    maxIterations: 10,
    pathPrecision: 2
  };
}

async function vectorize(dataUrl){
  await loadTracer();
  if(!vt.mod) return null;
  try{
    const img = await loadImage(dataUrl);
    const scale = Math.min(1, TRACE_MAX_PX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.filter = 'blur(' + TRACE_BLUR_PX + 'px)';
    ctx.drawImage(img, 0, 0, w, h);
    const px = ctx.getImageData(0, 0, w, h);
    const svg = vt.mod.to_svg(new Uint8Array(px.data.buffer), w, h, traceConfig(w, h));
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }catch(err){
    console.warn('Could not trace this photo, keeping the original.', err);
    return null;
  }
}

/* to_svg is synchronous and blocks the main thread for a few hundred ms, so
   photos are traced one at a time with a yield in between. Each row updates as
   it finishes instead of the page freezing on a batch of ten.
   ponytail: a Web Worker would keep the UI fully responsive - worth adding only
   if she starts adding far more photos at once than she does now. */
let traceQueue = Promise.resolve();
function queueTrace(job){
  traceQueue = traceQueue
    .then(() => new Promise(r => setTimeout(r, 0)))
    .then(job)
    .catch(err => console.warn('Trace job failed.', err));
  return traceQueue;
}

function addPhotoFiles(input){
  const files = Array.from(input.files);
  input.value = '';
  files.forEach(file => {
    readAsDataUrl(file, dataUrl => {
      const item = {
        tempId: 'p' + Date.now() + Math.random().toString(36).slice(2,6),
        dataUrl,
        displayUrl: dataUrl,
        name: guessNameFromFile(file),
        qty: 1,
        tracing: true
      };
      pending.push(item);
      renderPendingList();
      queueTrace(async () => {
        const svg = await vectorize(item.dataUrl);
        if(svg) item.displayUrl = svg;
        item.tracing = false;
        refreshPendingRow(item);
      });
    });
  });
}

blockPhotosInput.addEventListener('change', () => addPhotoFiles(blockPhotosInput));
blockCameraInput.addEventListener('change', () => addPhotoFiles(blockCameraInput));
takePhotoBtn.addEventListener('click', () => blockCameraInput.click());
pickPhotosBtn.addEventListener('click', () => blockPhotosInput.click());

/* Patch the single row in place: a full re-render here would wipe out whatever
   she happens to be typing into a name field at the time. */
function refreshPendingRow(item){
  const row = pendingListEl.querySelector('[data-temp-id="' + item.tempId + '"]');
  if(!row) return;
  row.classList.remove('tracing');
  const note = row.querySelector('.trace-note');
  if(note) note.remove();
  row.querySelector('img').src = item.displayUrl;
}

function renderPendingList(){
  pendingListEl.innerHTML = '';
  addAllBtn.style.display = pending.length ? 'block' : 'none';
  bulkQtyRow.style.display = pending.length ? 'flex' : 'none';
  pending.forEach(p => {
    const row = document.createElement('div');
    row.className = 'pending-item' + (p.tracing ? ' tracing' : '');
    row.dataset.tempId = p.tempId;
    row.innerHTML = `
      <img src="${p.displayUrl}" alt="">
      <input type="text" value="${escapeHtml(p.name)}" placeholder="Name this block">
      <input type="number" min="1" value="${p.qty}">
      <button class="link" title="Remove">Remove</button>
      ${p.tracing ? '<span class="trace-note">drawing a clean version of this block\u2026</span>' : ''}
    `;
    const [nameEl, qtyEl] = row.querySelectorAll('input');
    nameEl.addEventListener('input', () => { p.name = nameEl.value; });
    qtyEl.addEventListener('input', () => { p.qty = parseInt(qtyEl.value,10) || 1; });
    row.querySelector('button').addEventListener('click', () => {
      pending = pending.filter(x => x.tempId !== p.tempId);
      renderPendingList();
    });
    pendingListEl.appendChild(row);
  });
}

applyQtyBtn.addEventListener('click', () => {
  const val = parseInt(bulkQtyInput.value, 10);
  if(!val || val < 1) return;
  pending.forEach(p => { p.qty = val; });
  renderPendingList();
});

addAllBtn.addEventListener('click', () => {
  if(pending.some(p => !p.name.trim() || !p.qty || p.qty < 1)){
    alert('Every photo needs a name and a quantity of at least 1 before adding.');
    return;
  }
  pending.forEach(p => {
    blocks.push({
      id: 'b' + Date.now() + Math.random().toString(36).slice(2,6),
      name: p.name.trim(), qty: p.qty,
      photoDataUrl: p.dataUrl, displayUrl: p.displayUrl
    });
  });
  pending = [];
  renderPendingList();
  renderBlockList();
  if(!userEditedGrid) applySuggestion();
  updateTotals();
});

function renderBlockList(){
  blockListEl.innerHTML = '';
  emptyNote.style.display = blocks.length ? 'none' : 'block';
  blocks.forEach(b => {
    const row = document.createElement('div');
    row.className = 'block-item';
    row.innerHTML = `
      <img src="${b.displayUrl}" alt="">
      <div class="info">
        <div class="name">${escapeHtml(b.name)}</div>
        <div class="qty">${b.qty} block${b.qty===1?'':'s'}</div>
      </div>
      <button class="link" data-id="${b.id}">Remove</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      blocks = blocks.filter(x => x.id !== b.id);
      renderBlockList();
      if(!userEditedGrid) applySuggestion();
      updateTotals();
    });
    blockListEl.appendChild(row);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function totalBlocks(){
  return blocks.reduce((sum,b) => sum + b.qty, 0);
}

function suggestGrid(total){
  if(total <= 0) return {rows:4, cols:4};
  let r = Math.max(1, Math.round(Math.sqrt(total)));
  let c = Math.max(1, Math.round(total / r));
  return {rows:r, cols:c};
}

function applySuggestion(){
  const s = suggestGrid(totalBlocks());
  rowsInput.value = s.rows;
  colsInput.value = s.cols;
}

suggestBtn.addEventListener('click', () => {
  userEditedGrid = false;
  applySuggestion();
  updateTotals();
});

function updateTotals(){
  const total = totalBlocks();
  const rows = parseInt(rowsInput.value,10) || 0;
  const cols = parseInt(colsInput.value,10) || 0;
  const capacity = rows * cols;
  let msg = `<strong>${total}</strong> block${total===1?'':'s'} added &middot; grid holds <strong>${capacity}</strong>.`;
  if(capacity < total){
    msg += ` <span class="warn">${total - capacity} block${total-capacity===1?'':'s'} will be left over.</span>`;
  } else if(capacity > total){
    msg += ` <span class="warn">${capacity - total} empty cell${capacity-total===1?'':'s'} left, add more blocks or shrink the grid.</span>`;
  }
  totalsNote.innerHTML = msg;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function generateLayout(rows, cols, blockDefs){
  const capacity = rows * cols;
  let pool = [];
  blockDefs.forEach(b => { for(let i=0;i<b.qty;i++) pool.push(b.id); });

  let leftover = 0;
  if(pool.length > capacity){
    leftover = pool.length - capacity;
    pool = shuffle(pool.slice()).slice(0, capacity);
  }

  let best = null, bestConflicts = Infinity;
  const attempts = 200;
  for(let a=0; a<attempts; a++){
    const remaining = shuffle(pool.slice());
    const grid = new Array(capacity).fill(null);
    for(let cell=0; cell<capacity; cell++){
      const r = Math.floor(cell/cols), c = cell % cols;
      const leftId = c>0 ? grid[cell-1] : null;
      const topId = r>0 ? grid[cell-cols] : null;
      let found = -1;
      for(let k=0;k<remaining.length;k++){
        if(remaining[k] !== leftId && remaining[k] !== topId){ found = k; break; }
      }
      if(found === -1) found = remaining.length ? 0 : -1;
      if(found === -1){ grid[cell] = null; continue; }
      grid[cell] = remaining[found];
      remaining.splice(found,1);
    }
    let conflicts = 0;
    for(let cell=0; cell<capacity; cell++){
      const r = Math.floor(cell/cols), c = cell % cols;
      if(grid[cell] === null) continue;
      if(c>0 && grid[cell] === grid[cell-1]) conflicts++;
      if(r>0 && grid[cell] === grid[cell-cols]) conflicts++;
    }
    if(conflicts < bestConflicts){ bestConflicts = conflicts; best = grid; }
    if(conflicts === 0) break;
  }
  return { grid: best, conflicts: bestConflicts, leftover, capacity, used: capacity - best.filter(x=>x===null).length };
}

generateBtn.addEventListener('click', () => {
  if(!blocks.length){
    alert('Add at least one block pattern first.');
    return;
  }
  const rows = parseInt(rowsInput.value,10);
  const cols = parseInt(colsInput.value,10);
  if(!rows || !cols || rows<1 || cols<1){
    alert('Rows and columns need to be at least 1.');
    return;
  }
  const result = generateLayout(rows, cols, blocks);
  renderResult(result, rows, cols);
});

function renderResult(result, rows, cols){
  const byId = {};
  blocks.forEach(b => byId[b.id] = b);

  resultGrid.style.setProperty('--cols', cols);
  resultGrid.innerHTML = '';
  result.grid.forEach(id => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(id){
      const img = document.createElement('img');
      img.src = byId[id].displayUrl;
      img.title = byId[id].name;
      cell.appendChild(img);
    }
    resultGrid.appendChild(cell);
  });

  const usedCounts = {};
  result.grid.forEach(id => { if(id) usedCounts[id] = (usedCounts[id]||0) + 1; });
  legendEl.innerHTML = '';
  blocks.forEach(b => {
    const used = usedCounts[b.id] || 0;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<img src="${b.displayUrl}" alt=""><span>${escapeHtml(b.name)}: ${used}/${b.qty}</span>`;
    legendEl.appendChild(item);
  });

  let note = '';
  if(result.leftover > 0){
    note += `${result.leftover} block${result.leftover===1?'':'s'} didn't fit in this grid size and weren't used. `;
  }
  if(result.conflicts > 0){
    note += `Couldn't fully avoid matching blocks touching, ${result.conflicts} pair${result.conflicts===1?'':'s'} of the same block ended up next to each other because of the quantities on hand.`;
  } else if(!note){
    note = 'No two matching blocks end up touching.';
  }
  resultNote.textContent = note;
  resultCard.style.display = 'block';
  resultCard.scrollIntoView({behavior:'smooth', block:'start'});
}

renderBlockList();
updateTotals();

/* --- Live updates ---------------------------------------------------------
   The whole app is HTML/CSS/JS, so a new version can be delivered without
   building or sending another APK. On launch the app reads a small manifest
   from GitHub Pages; if it names a bundle we do not already have, the zip is
   downloaded and staged, and the next launch starts on the new version.
   Everything below is a no-op in a plain browser and when offline. */
const UPDATE_MANIFEST_URL =
  'https://websterdr21-dev.github.io/blanket-block-planner/live/manifest.json';

async function checkForUpdate(){
  const cap = window.Capacitor;
  const LiveUpdate = cap && cap.Plugins && cap.Plugins.LiveUpdate;
  if(!LiveUpdate || !(cap.isNativePlatform && cap.isNativePlatform())) return;

  /* Tell the plugin this bundle booted successfully. Without it the plugin
     assumes the running bundle is broken and rolls back to the previous one. */
  try{ await LiveUpdate.ready(); }
  catch(err){ console.warn('LiveUpdate.ready() failed.', err); }

  try{
    const res = await fetch(UPDATE_MANIFEST_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const manifest = await res.json();
    if(!manifest.bundleId || !manifest.url) return;

    const current = await LiveUpdate.getCurrentBundle();
    if(current.bundleId === manifest.bundleId) return;

    const downloaded = await LiveUpdate.getBundles();
    if(!downloaded.bundleIds.includes(manifest.bundleId)){
      await LiveUpdate.downloadBundle({
        bundleId: manifest.bundleId,
        url: manifest.url,
        checksum: manifest.checksum
      });
    }
    await LiveUpdate.setNextBundle({ bundleId: manifest.bundleId });
    console.log('Update ' + manifest.bundleId + ' staged, it starts on the next launch.');
  }catch(err){
    /* No signal, GitHub down, bad zip: keep running the version we have. */
    console.warn('Update check skipped.', err);
  }
}

checkForUpdate();
</script>
